services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fms
      POSTGRES_PASSWORD: fms_password
      POSTGRES_DB: fms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./Back-end
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://fms:fms_password@postgres:5432/fms?schema=public
      PORT: 4000
      FRONTEND_URL: http://localhost:3001
      PYTHON_SERVICE_URL: http://reports:8000
      NODE_ENV: development
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - reports

  reports:
    build: ./services/reports
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3001:3000"
    volumes:
      - ./Front-end:/app/apps/web/public/legacy:ro
    depends_on:
      - api

volumes:
  postgres_data:

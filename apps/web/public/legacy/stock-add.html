<body><header class="topbar"><a class="brand" href="./menu.html"><img src="./assets/fms.png" alt="FMS"><span>First Aid &amp; Medicine Management System</span></a><div class="actions"><a class="menu-button" href="./menu.html" aria-label="กลับไปหน้าเมนู"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx=".7"/><rect x="14" y="3" width="7" height="7" rx=".7"/><rect x="3" y="14" width="7" height="7" rx=".7"/><rect x="14" y="14" width="7" height="7" rx=".7"/></svg></a><button class="export" type="button">Excel</button><button class="export" type="button">PDF</button><button id="notificationButton" class="bell" type="button" aria-label="การแจ้งเตือน"><svg viewBox="0 0 24 24"><path d="M6 17h12l-1.4-2.2V10a4.6 4.6 0 0 0-9.2 0v4.8L6 17Zm4 2a2 2 0 0 0 4 0"/></svg></button><button class="language" type="button"><i></i><span>ไทย</span></button></div></header>
<main class="page"><form id="medicineForm" class="add-form"><div class="form-heading"><div><p class="eyebrow">MEDICINE INVENTORY</p><h1 id="formTitle">เพิ่มยา</h1><p id="formDescription">กรอกข้อมูลสินค้าเพื่อเพิ่มรายการใหม่เข้าสู่คลังยา</p></div><a class="back-stock" href="./stock.html">← กลับหน้าคลังยา</a></div><div class="form-layout"><section class="preview-panel"><label class="field name-field"><span>ชื่อยา *</span><input name="name" required placeholder="เช่น Paracetamol"></label><div id="imagePreview" class="image-preview"><span>รูปภาพยา</span></div><label class="upload-button"><input id="imageInput" type="file" accept="image/*">＋ เลือกรูปยา</label><p class="preview-hint">รองรับไฟล์ JPG, PNG และ WEBP</p><section class="inventory-card"><h2>คงคลัง</h2><label class="stock-input total"><span>ทั้งหมด</span><input name="total" type="number" min="0" value="0"><b>หน่วย</b></label><label class="stock-input used"><span>ใช้/เบิก</span><input name="used" type="number" min="0" value="0"><b>หน่วย</b></label><label class="stock-input remaining"><span>เหลือ</span><input name="remaining" type="number" min="0" value="0"><b>หน่วย</b></label></section></section><section class="details-panel"><h2>รายละเอียดของยา</h2><div class="details-grid"><label class="field"><span>ชื่อสินค้า</span><input name="productName"></label><label class="field"><span>ชื่อสามัญ</span><input name="genericName"></label><label class="field"><span>ประเภท</span><select name="category"><option value="oral">ยากิน</option><option value="topical">ยาทา</option><option value="equipment">เวชภัณฑ์</option></select></label><label class="field"><span>รหัสยา</span><input name="code"></label><label class="field"><span>รูปแบบ</span><input name="form"></label><label class="field"><span>ขนาด</span><input name="size"></label><label class="field"><span>หน่วยนับ</span><input name="unit"></label><label class="field"><span>สถานะสินค้า</span><select name="status"><option>ปกติ</option><option>ใกล้หมด</option><option>หมด</option></select></label><label class="field full"><span>สรรพคุณ</span><textarea name="benefit"></textarea></label><label class="field full"><span>อาการที่ใช้</span><textarea name="symptom"></textarea></label><label class="field full"><span>วิธีใช้โดยทั่วไป</span><textarea name="usage"></textarea></label><label class="field full"><span>ข้อควรระวัง</span><textarea name="warning"></textarea></label><label class="field"><span>วันหมดอายุ</span><input name="expiry" type="date"></label></div></section></div><div class="form-actions"><p id="message" aria-live="polite"></p><button class="cancel" type="button">ยกเลิก</button><button id="clearButton" class="clear" type="reset">ล้างข้อมูล</button><button class="save" type="submit">บันทึกข้อมูล</button></div></form></main><aside id="notificationPanel" class="notification-panel" hidden><button id="closeNotification" type="button">×</button><strong>การแจ้งเตือน</strong><p>ตรวจสอบสถานะคลังยาได้ที่หน้า Stock</p></aside><script src="./stock-add.js?v=database1"></script><script src="./language-toggle.js?v=13"></script><script src="./header-controls.js?v=3"></script><script src="./stock-add-select.js?v=2"></script></body></html>

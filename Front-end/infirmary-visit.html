<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FMS | Infirmary Visit</title>
  <link rel="icon" href="./assets/fms.png">
  <link rel="stylesheet" href="./infirmary-visit.css?v=23">
  <link rel="stylesheet" href="./header-controls.css">
  <link rel="stylesheet" href="./button-animations.css?v=3">
  <link rel="stylesheet" href="./font-kanit.css?v=1">
  <link rel="stylesheet" href="./theme-colors.css?v=2">
  <link rel="stylesheet" href="./dashboard-topbar.css?v=1">
  <link rel="stylesheet" href="./dashboard-refresh.css?v=14">
  <link rel="stylesheet" href="./infirmary-visit-faculty-branch.css?v=6">
<script src="./legacy-storage.js?v=2"></script></head>
<body>
  <header class="topbar dashboard-topbar">
    <a class="brand" href="./menu.html"><img src="./assets/fms.png" alt="FMS"><span>First Aid &amp; Medicine Management System</span></a>
    <div class="actions">
      <a class="menu-button" href="./menu.html" aria-label="กลับไปหน้าเมนู"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></a>
      <button class="export excel" type="button">Excel</button>
      <button class="export pdf" type="button">PDF</button>
      <button id="noticeButton" class="bell" type="button" aria-label="การแจ้งเตือน" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17h12l-1.4-2.2V10a4.6 4.6 0 0 0-9.2 0v4.8L6 17Zm4 2a2 2 0 0 0 4 0"/></svg></button>
      <button id="languageButton" class="language" type="button"><i></i><span>ไทย</span></button>
    </div>
  </header>
  <main class="page">
    <a class="pending-link" href="./pending-assessment.html">รอประเมิน</a>
    <form id="visitForm" class="visit-form">
      <h2 data-i18n="formTitle">ฟอร์มการเข้าใช้ห้องพยาบาล</h2>
      <div class="visitor-type">
        <label class="visitor-option internal" data-type="student"><input class="visitor-check" type="checkbox" value="student"><i></i><span data-i18n="student">บุคลากรภายใน</span></label>
        <label class="visitor-option external" data-type="guest"><input class="visitor-check" type="checkbox" value="guest"><i></i><span data-i18n="guest">บุคลากรภายนอก</span></label>
        <input id="visitorDetail" class="visitor-detail" name="visitorDetail" disabled placeholder="เลือกประเภทบุคลากรก่อน">
      </div>
      <section class="form-grid">
        <label class="wide"><span data-i18n="firstName">ชื่อ</span><input name="firstName" required></label>
        <label class="wide"><span data-i18n="lastName">นามสกุล</span><input name="lastName" required></label>
        <label><span data-i18n="nickname">ชื่อเล่น</span><input name="nickname"></label>
        <label><span data-i18n="age">อายุ</span><input name="age" type="number" min="0" placeholder="ปี"></label>
        <label><span data-i18n="studentId">รหัสนักศึกษา</span><input name="studentId"></label>
        <label><span>หลักสูตร</span><select id="facultySelect" name="faculty"><option value="all">ทั้งหมด</option><option value="engineering">หลักสูตรวิศวกรรมศาสตร์</option><option value="agriculture">หลักสูตรเทคโนโลยีการเกษตรและวิทยาศาสตร์</option><option value="business">หลักสูตรบริหารธุรกิจและนวัตกรรม</option></select></label>
        <label><span data-i18n="branch">สาขา</span><select id="branchSelect" name="branch"><option value="all">ทั้งหมด</option></select></label>
        <label><span data-i18n="gender">เพศ</span><select name="gender"><option>เลือก</option><option>ชาย</option><option>หญิง</option></select></label>
        <label><span data-i18n="blood">กรุ๊ปเลือด</span><select name="blood"><option>เลือก</option><option>A</option><option>B</option><option>AB</option><option>O</option></select></label>
        <label><span data-i18n="weight">น้ำหนัก</span><input name="weight" type="number" min="0" placeholder="กก."></label>
        <label><span data-i18n="height">ส่วนสูง</span><input name="height" type="number" min="0" placeholder="ซม."></label>
        <label class="wide"><span data-i18n="symptom">อาการ</span><input name="symptom" placeholder="ระบุอาการ" required></label>
      </section>
      <section class="vitals">
        <div class="vitals-head"><span data-i18n="vitals">ผลการวัดความดัน</span></div>
        <div class="vital-inputs"><label>SYS<input name="sys" type="number" min="0" inputmode="numeric"></label><label>DIA<input name="dia" type="number" min="0" inputmode="numeric"></label><label>PR<input name="pr" type="number" min="0" inputmode="numeric"></label></div>
      </section>
      <section class="bottom-grid">
        <label><span data-i18n="medicine">ยาที่ได้รับ</span><select name="medicine"><option>เลือกยา</option><option>Paracetamol 500 mg</option><option>ORS</option><option>Cetirizine 10 mg</option></select></label>
        <label><span data-i18n="quantity">จำนวนยา /หน่วย</span><input name="quantity" type="number" min="0" placeholder="หน่วย"></label>
      </section>
      <fieldset class="status"><legend data-i18n="status">สถานะ</legend><label><input type="checkbox" name="status" value="normal"><i></i><span data-i18n="normal">ปกติ</span></label><label><input type="checkbox" name="status" value="observe"><i></i><span data-i18n="observe">รอดูอาการ</span></label><label><input type="checkbox" name="status" value="refer"><i></i><span data-i18n="refer">ส่งโรงพยาบาล</span></label></fieldset>
      <div id="referralHospitalField" class="referral-hospital" hidden><label><span>ชื่อโรงพยาบาลที่ส่งต่อ</span><input name="hospitalName" disabled placeholder="ระบุชื่อโรงพยาบาล"></label></div>
      <p id="formMessage" class="form-message" aria-live="polite"></p>
      <div class="form-actions"><button id="cancelButton" class="cancel" type="reset" data-i18n="cancel">ยกเลิก</button><button class="save" type="submit" data-i18n="save">บันทึก</button></div>
    </form>
  </main>
  <aside id="notificationPanel" class="notification-panel" hidden><button id="closeNotifications" type="button" aria-label="ปิด">×</button><strong>การแจ้งเตือน</strong><p>มีรายการรอดำเนินการ 6 รายการ</p></aside>
  <script src="./infirmary-visit.js?v=6"></script>
  <script src="./infirmary-visit-branch-lock.js?v=1"></script>
  <script src="./infirmary-visit-faculty-branch.js?v=2"></script>
<script src="./language-toggle.js?v=13"></script><script src="./header-controls.js?v=3"></script></body>
</html>

<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FMS | รถเข็นสินค้า</title><link rel="icon" href="./assets/fms.png">
  <link rel="stylesheet" href="./catalog-cart.css?v=9"><link rel="stylesheet" href="./header-controls.css"><link rel="stylesheet" href="./button-animations.css?v=3">
<link rel="stylesheet" href="./font-kanit.css?v=1"><link rel="stylesheet" href="./theme-colors.css?v=2"><script src="./legacy-storage.js?v=3"></script><link rel="stylesheet" href="./responsive.css?v=3"></head>
<body>
  <header class="topbar"><a class="brand" href="./menu.html"><img src="./assets/fms.png" alt="FMS"/><span>First Aid &amp; Medicine Management System</span></a><div class="actions"><a class="menu-button" href="./menu.html" aria-label="กลับไปหน้าเมนู"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx=".7"/><rect x="14" y="3" width="7" height="7" rx=".7"/><rect x="3" y="14" width="7" height="7" rx=".7"/><rect x="14" y="14" width="7" height="7" rx=".7"/></svg></a><button class="export excel" type="button">Excel</button><button class="export pdf" type="button">PDF</button><button class="bell" type="button" aria-label="การแจ้งเตือน"><svg viewBox="0 0 24 24"><path d="M6 17h12l-1.4-2.2V10a4.6 4.6 0 0 0-9.2 0v4.8L6 17Zm4 2a2 2 0 0 0 4 0"/></svg></button><button class="language" type="button"><i></i><span>ไทย</span></button></div></header>
  <main class="cart-page">
    <div class="cart-heading"><h1>Medicine &amp; Medical<br>Supplies Catalog</h1><a class="cart-back" href="./catalog.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8l-4 4 4 4M8 12h8"/></svg>กลับหน้า Catalog</a></div>
    <section class="cart-title"><h2>ตะกร้า <span id="cartTotal">(0)</span></h2><button id="clearCart" type="button">ล้างตะกร้า</button></section>
    <section id="cartList" class="cart-list"></section>
  </main>
  <footer class="cart-footer"><label><input id="selectAll" type="checkbox"><span>ทั้งหมด</span></label><button id="deleteSelected" type="button">ลบ</button><button id="placeOrder" class="place-order" type="button">สั่งสินค้า</button></footer>
  <div id="confirmModal" class="modal-backdrop" hidden>
    <section class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-icon warning">×</div>
      <h2 id="modalTitle">ต้องการลบสินค้าหรือไม่</h2>
      <div class="modal-actions"><button id="modalCancel" type="button">ไม่</button><button id="modalConfirm" type="button">ใช่</button></div>
    </section>
  </div>
  <script src="./catalog-cart.js?v=10"></script>
<script src="./language-toggle.js?v=13"></script><script src="./header-controls.js?v=3"></script></body>
